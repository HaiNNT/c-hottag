name: Bug report
description: Something in c-hottag does not work the way its docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. A security problem never goes in an issue: report it privately, as [SECURITY.md](https://github.com/HaiNNT/c-hottag/blob/main/SECURITY.md) describes. Questions about your Claude account, plan, billing or usage limits go to Anthropic support, since c-hottag can't see or change them.

        Issues are public. Before you paste anything, remove emails, account and org names, home paths, session links, and every token, `proxy.secret` or `ca.key`. Call your accounts A and B.
  - type: checkboxes
    id: privacy
    attributes:
      label: Personal data
      options:
        - label: This issue contains no personal data or tokens.
          required: true
  - type: input
    id: chottag-version
    attributes:
      label: chottag version
      description: The output of `chottag version`.
      placeholder: v0.4.0
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS, Apple silicon (arm64)
        - macOS, Intel (amd64)
        - Linux, arm64
        - Linux, amd64
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: chottag doctor
      description: The output of `chottag doctor`, with personal data removed.
      render: text
