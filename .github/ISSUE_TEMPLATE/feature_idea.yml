name: Feature idea
description: Something c-hottag could do. Every idea is read; none is promised.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. [ROADMAP.md](https://github.com/HaiNNT/c-hottag/blob/main/ROADMAP.md) lists what is already planned, and what is not. A security problem never goes in an issue: see [SECURITY.md](https://github.com/HaiNNT/c-hottag/blob/main/SECURITY.md).
  - type: checkboxes
    id: privacy
    attributes:
      label: Personal data
      options:
        - label: This issue contains no personal data or tokens.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What c-hottag could do about it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Anything you tried instead, with c-hottag or another tool.
